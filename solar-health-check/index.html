<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNNEX Solar Health Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10222B;
    --ink-soft:#3D5560;
    --panel:#EEF2F1;
    --surface:#FFFFFF;
    --line:#DDE4E2;
    --amber:#F2A93B;
    --teal:#1B7A6E;
    --pass:#2F8F5B;
    --warn:#E0932F;
    --fail:#C24C3D;
    --pass-bg:#E7F4EC;
    --warn-bg:#FCF1E1;
    --fail-bg:#FBEAE7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{display:flex;min-height:100vh;}
  .rail{
    width:250px;flex-shrink:0;background:var(--ink);color:#CFE0DC;
    padding:22px 14px 22px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .rail-brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:14px;}
  .rail-brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--amber),#C97C1E);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:14px;}
  .rail-brand .txt{line-height:1.15;}
  .rail-brand .txt b{font-family:'Space Grotesk';font-size:13.5px;color:#fff;display:block;}
  .rail-brand .txt span{font-size:10.5px;color:#9FB6B0;letter-spacing:.03em;}

  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .navlist li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#B9CBC6;transition:background .15s,color .15s;}
  .navlist li:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navlist li.active{background:rgba(242,169,59,0.14);color:#fff;}
  .navlist li.active .num{background:var(--amber);color:var(--ink);}
  .navlist .num{
    width:20px;height:20px;flex-shrink:0;border-radius:5px;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10px;color:#9FB6B0;
  }
  .navlist .status-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#4A5F5A;flex-shrink:0;}
  .navlist .status-dot.done{background:var(--pass);}
  .navlist .status-dot.issue{background:var(--fail);}

  .main{flex:1;min-width:0;}
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  }
  .topbar .id-block{margin-right:auto;}
  .topbar .id-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .topbar .id-block .val{font-family:'Space Grotesk';font-weight:600;font-size:15px;}
  .gauge-wrap{display:flex;align-items:center;gap:12px;}
  .gauge-score{font-family:'Space Grotesk';font-weight:700;font-size:22px;}
  .gauge-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.02em;}

  .content{padding:26px 28px 80px;max-width:880px;}
  .section{display:none;}
  .section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .sec-head{margin-bottom:20px;}
  .sec-eyebrow{font-family:'IBM Plex Mono';font-size:11px;color:var(--teal);letter-spacing:.06em;}
  .sec-title{font-family:'Space Grotesk';font-size:23px;font-weight:700;margin:2px 0 6px;}
  .sec-sub{font-size:13px;color:var(--ink-soft);line-height:1.5;max-width:60ch;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h4{font-family:'Space Grotesk';font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card h4 .swatch{width:6px;height:16px;border-radius:3px;background:var(--teal);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:'Inter';
    background:#FBFCFC;color:var(--ink);
  }
  .field input.mono,.field textarea.mono{font-family:'IBM Plex Mono';}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .field textarea{resize:vertical;min-height:64px;}

  .insp-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .insp-row:last-child{border-bottom:none;}
  .insp-name{flex:1;font-size:13.5px;font-weight:500;}
  .insp-name .insp-th{font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;}
  .seg button{
    border:none;background:var(--surface);padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;
    color:var(--ink-soft);font-family:'Inter';border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button[data-v="pass"].active{background:var(--pass-bg);color:var(--pass);}
  .seg button[data-v="fail"].active{background:var(--fail-bg);color:var(--fail);}
  .seg button[data-v="na"].active{background:#EEF0EF;color:var(--ink-soft);}

  .photo-btn{
    width:34px;height:34px;border-radius:7px;border:1px dashed var(--line);background:#FBFCFC;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink-soft);
    font-size:14px;overflow:hidden;background-size:cover;background-position:center;position:relative;
  }
  .photo-btn.has-photo{border-style:solid;border-color:var(--teal);color:transparent;}
  .photo-btn.has-photo::after{content:"✓";position:absolute;bottom:-2px;right:-2px;background:var(--teal);color:#fff;
    width:14px;height:14px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;}
  .photo-btn-lg{width:100%;height:80px;border-radius:8px;}
  .remark-toggle{font-size:11px;color:var(--teal);cursor:pointer;flex-shrink:0;text-decoration:underline;text-underline-offset:2px;}

  .rec-level{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin-bottom:14px;}
  .rec-level.immediate{border-color:var(--fail);}
  .rec-level.improve{border-color:var(--warn);}
  .rec-level.future{border-color:var(--teal);}
  .rec-level h5{margin:0 0 3px;font-family:'Space Grotesk';font-size:13.5px;}
  .rec-level p{margin:0 0 8px;font-size:12px;color:var(--ink-soft);}
  .rec-level textarea{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:'Inter';}

  .btn-row{display:flex;justify-content:space-between;margin-top:24px;}
  .btn{font-family:'Inter';font-weight:600;font-size:13px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.primary:hover{background:#1c3540;}
  .btn.small{padding:6px 12px;font-size:12px;}

  .weight-note{font-size:11px;color:var(--ink-soft);background:#FBFCFC;border:1px dashed var(--line);padding:10px 12px;border-radius:8px;margin-top:4px;}
  .placeholder-note{font-size:12px;color:var(--ink-soft);background:#FBFCFC;border:1px dashed var(--line);border-radius:8px;padding:12px 14px;}
  .field-th{display:block;font-weight:400;font-size:10.5px;color:#8FA39D;margin-top:2px;letter-spacing:0;}

  .topbar-actions{display:flex;gap:8px;}
  .tb-btn{
    display:flex;align-items:center;gap:6px;font-family:'Inter';font-weight:600;font-size:12.5px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);
  }
  .tb-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---- measurement table ---- */
  .meas-table{width:100%;border-collapse:collapse;}
  .meas-table th{text-align:left;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px;font-weight:600;}
  .meas-table td{padding:5px 8px;vertical-align:middle;}
  .meas-table input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:'Inter';background:#FBFCFC;}
  .meas-table input.mono{font-family:'IBM Plex Mono';}
  .meas-table tr{border-bottom:1px solid var(--line);}
  .meas-del{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--fail);cursor:pointer;font-size:13px;line-height:1;}
  .meas-add{margin-top:12px;}

  /* ---- photo report grid ---- */
  .pr-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .pr-row:last-child{border-bottom:none;}
  .pr-photo{width:44px;height:44px;border-radius:8px;flex-shrink:0;}
  .pr-name{flex:0 0 150px;font-size:13px;font-weight:500;}
  .pr-note{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;font-family:'Inter';background:#FBFCFC;}

  /* ---- report preview ---- */
  .report-view{display:none;}
  body.report-mode .app{display:none;}
  body.report-mode .report-view{display:block;}
  .report-shell{max-width:840px;margin:0 auto;padding:30px 20px 90px;}
  .report-toolbar{position:sticky;top:0;background:var(--panel);padding:14px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;z-index:5;}
  .rep-page{background:#fff;border:1px solid var(--line);border-radius:12px;padding:40px 44px;box-shadow:0 1px 3px rgba(16,34,43,0.06);margin-bottom:22px;}
  .rep-page-label{font-family:'IBM Plex Mono';font-size:10px;color:var(--ink-soft);margin:0 0 8px;letter-spacing:.05em;}
  .rep-cover{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:26px;}
  .rep-brand{display:flex;align-items:center;gap:10px;}
  .rep-brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#C97C1E);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--ink);}
  .rep-brand b{font-family:'Space Grotesk';font-size:15px;display:block;}
  .rep-brand span{font-size:10.5px;color:var(--ink-soft);}
  .rep-id{text-align:right;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}
  .rep-title{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:0 0 4px;}
  .rep-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:26px;}

  .rep-score-block{display:flex;align-items:center;gap:22px;background:var(--panel);border-radius:12px;padding:20px 24px;margin-bottom:26px;}
  .rep-score-circle{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rep-score-circle .inner{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .rep-score-circle .inner b{font-family:'Space Grotesk';font-size:20px;}
  .rep-score-circle .inner span{font-size:8.5px;color:var(--ink-soft);}
  .rep-score-text b{font-family:'Space Grotesk';font-size:15px;}
  .rep-score-text p{font-size:12px;color:var(--ink-soft);margin:4px 0 0;line-height:1.5;}
  .rep-pill{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--pass);padding:3px 10px;border-radius:99px;margin-left:8px;vertical-align:middle;}

  .rep-section{margin-bottom:24px;}
  .rep-section h3{font-family:'Space Grotesk';font-size:14.5px;border-left:3px solid var(--teal);padding-left:10px;margin:0 0 10px;}
  .rep-cat-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .rep-cat-row:last-child{border-bottom:none;}
  .rep-cat-row .name{flex:1;font-weight:600;}
  .rep-cat-row .bar-wrap{flex:2;height:6px;background:#E4E9E8;border-radius:99px;overflow:hidden;}
  .rep-cat-row .bar{height:100%;border-radius:99px;background:var(--pass);}
  .rep-cat-row .pct{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);width:44px;text-align:right;}

  .rep-meas-table{width:100%;border-collapse:collapse;font-size:12px;}
  .rep-meas-table th{text-align:left;padding:6px 8px;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--ink);}
  .rep-meas-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .rep-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
  .rep-badge.pass{background:var(--pass-bg);color:var(--pass);}
  .rep-badge.fail{background:var(--fail-bg);color:var(--fail);}
  .rep-badge.na{background:#EEF0EF;color:var(--ink-soft);}

  .rep-photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .rep-photo-grid figure{margin:0;}
  .rep-photo-grid .ph{aspect-ratio:1;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#B7C4C0;background-size:cover;background-position:center;}
  .rep-photo-grid figcaption{font-size:10px;color:var(--ink-soft);margin-top:4px;text-align:center;}

  .rep-reco{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:10px;font-size:12.5px;}
  .rep-reco.immediate{border-color:var(--fail);}
  .rep-reco.improve{border-color:var(--warn);}
  .rep-reco.future{border-color:var(--teal);}
  .rep-reco b{display:block;font-family:'Space Grotesk';font-size:12.5px;}

  .rep-quote{background:var(--panel);border-radius:8px;padding:14px 16px;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:8px;}
  .rep-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px;}
  .rep-sign div{border-top:1px solid var(--line);padding-top:8px;font-size:11.5px;color:var(--ink-soft);}
  .rep-sign div b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px;}
  .rep-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);}
  .rep-qr{width:54px;height:54px;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);text-align:center;}
  .rep-footer .note{font-size:10.5px;color:var(--ink-soft);max-width:60ch;}

  @media print{
    .no-print{display:none !important;}
    .report-shell{padding:0;max-width:none;}
    .rep-page{border:none;box-shadow:none;border-radius:0;padding:0;page-break-after:always;margin-bottom:0;}
    .rep-page:last-child{page-break-after:auto;}
    body{background:#fff;}
  }

  ::selection{background:var(--amber);color:var(--ink);}
</style>
</head>
<body>
<div class="app">

  <nav class="rail">
    <div class="rail-brand">
      <div class="mark">S</div>
      <div class="txt"><b>Solar Health Check</b><span>SYNNEX · Installation & Maintenance</span></div>
    </div>
    <ul class="navlist" id="navlist"></ul>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="id-block">
        <div class="lbl">Inspection ID</div>
        <div class="val mono" id="topId">SHC-2026-0000</div>
      </div>
      <div class="gauge-wrap">
        <svg width="46" height="46" viewBox="0 0 46 46">
          <circle cx="23" cy="23" r="19" fill="none" stroke="#E4E9E8" stroke-width="5"/>
          <circle id="gaugeArc" cx="23" cy="23" r="19" fill="none" stroke="#2F8F5B" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"
                  transform="rotate(-90 23 23)"/>
        </svg>
        <div>
          <div class="gauge-score" id="gaugeScore">—</div>
          <div class="gauge-status" id="gaugeStatus">Not started</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="tb-btn primary" onclick="openReport()">📄 ดูตัวอย่าง PDF Report</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="report-view" id="reportView">
  <div class="report-shell">
    <div class="report-toolbar no-print">
      <button class="tb-btn" onclick="closeReport()">← กลับไปกรอกข้อมูล</button>
      <button class="tb-btn primary" onclick="window.print()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    </div>
    <div id="reportPages"></div>
  </div>
</div>

<script>
/* =========================================================
   GLOBAL STATE — ทุกช่องที่มี data-bind จะเขียนเข้ามาที่นี่
   และหน้า Report จะดึงค่าจากตรงนี้แบบสด (live)
========================================================= */
const formData = {
  cover:{}, sysinfo:{}, fusion:{}, assess:{}, reco:{}, ack:{}, history:{}
};
const photos = {};        // key -> dataURL   (photo report + fusion screenshot)
const inspPhotos = {};    // rid -> dataURL   (photo attached inline in checklist rows)
let measurements = [
  {name:"แรงดันไฟฟ้า AC (Voltage AC)", value:"", unit:"V", ref:"220V ±10% (1P) / 380V ±10% (3P)"},
  {name:"กระแสไฟฟ้า AC (Current AC)", value:"", unit:"A", ref:"ไม่เกินพิกัด Inverter"},
  {name:"แรงดันวงจรเปิด DC (Voc)", value:"", unit:"V", ref:"ตาม Datasheet ของแผง"},
  {name:"กระแสลัดวงจร DC (Isc)", value:"", unit:"A", ref:"ตาม Datasheet ของแผง"},
  {name:"ค่าความต้านทานสายดิน", value:"", unit:"Ω", ref:"≤ 5 Ω"},
  {name:"ค่าความต้านทานฉนวน (Insulation)", value:"", unit:"MΩ", ref:"≥ 1 MΩ"},
  {name:"ความถี่ไฟฟ้า (Frequency)", value:"", unit:"Hz", ref:"50 Hz ±1%"},
  {name:"อุณหภูมิจุดต่อสาย", value:"", unit:"°C", ref:"≤ 60°C หรือไม่เกิน +15°C จากอุณหภูมิแวดล้อม"},
];
let measResults = {}; // index -> pass/fail/na

const photoReportCats = [
  {key:"roofOverview", en:"Roof / Array Overview", th:"ภาพรวมหลังคา / พื้นที่ติดตั้งแผง"},
  {key:"pvModule", en:"PV Module", th:"แผงโซลาร์ (ระยะใกล้)"},
  {key:"mounting", en:"Mounting Structure", th:"โครงสร้างยึดแผง"},
  {key:"dcRouting", en:"DC Cable Routing (Roof)", th:"แนวเดินสาย DC บนหลังคา"},
  {key:"conduit", en:"Conduit Routing", th:"แนวเดินท่อร้อยสาย"},
  {key:"junctionBox", en:"Junction Box / Connector", th:"กล่องต่อสาย / คอนเนคเตอร์"},
  {key:"inverter", en:"Inverter", th:"อินเวอร์เตอร์"},
  {key:"battery", en:"Battery", th:"แบตเตอรี่"},
  {key:"cabinet", en:"Electrical Cabinet", th:"ตู้ไฟฟ้า"},
  {key:"grounding", en:"Grounding Point", th:"จุดต่อสายดิน"},
  {key:"nameplate", en:"Nameplate / Serial", th:"ป้ายรุ่น / หมายเลขเครื่อง"},
  {key:"monitoring", en:"Monitoring Screenshot", th:"หน้าจอระบบมอนิเตอร์"},
];

/* ---------------- nav / sections meta ---------------- */
const sections = [
  {id:"cover", num:"01", title:"Cover / Site Information", eyebrow:"เริ่มต้น"},
  {id:"summary", num:"02", title:"Executive Summary", eyebrow:"สรุปผล"},
  {id:"sysinfo", num:"03", title:"System Information", eyebrow:"ข้อมูลระบบ"},
  {id:"fusion", num:"04", title:"FusionSolar Performance", eyebrow:"ตรวจจากแดชบอร์ด", weight:25},

/* ---------------- generic field helpers ---------------- */
// field = [enLabel, thGloss] OR [enLabel, thGloss, {bind:"cover.customerName", type:"date"}]
function fieldsGrid(fields, cols=3){
  const cls = cols===2?"grid2":"grid3";
  return `<div class="${cls}">` + fields.map(f=>{
    const en = f[0], th = f[1], opts = f[2]||{};
    const type = opts.type || "text";
    const bindAttr = opts.bind ? `data-bind="${opts.bind}"` : "";
    return `<div class="field"><label>${en}${th?`<span class="field-th">${th}</span>`:""}</label><input type="${type}" ${bindAttr} placeholder="${type==='date'?'':'—'}"></div>`;
  }).join("") + `</div>`;
}

// delegated listener: writes any input/textarea with data-bind into formData
document.addEventListener("input", (e)=>{
  const el = e.target;
  const path = el.dataset && el.dataset.bind;
  if(!path) return;
  const [group, key] = path.split(".");
  if(!formData[group]) formData[group] = {};
  formData[group][key] = el.value;
  syncCrossLinks();
});

function syncCrossLinks(){
  const id = formData.cover.inspectionId;
  document.getElementById("topId").textContent = id ? "SHC-2026-" + String(id).padStart(4,"0").slice(-4) : "SHC-2026-0000";
}

/* ---------------- photo upload (works everywhere) ---------------- */
function photoBtn(key, big){
  return `<input type="file" accept="image/*" id="file-${key}" style="display:none" onchange="handlePhotoUpload(event,'${key}')">
  <div class="photo-btn ${big?'photo-btn-lg':''}" id="thumb-${key}" onclick="document.getElementById('file-${key}').click()" title="แนบรูป">📷</div>`;
}
function handlePhotoUpload(e, key){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const url = ev.target.result;
    if(key.startsWith("insp:")) inspPhotos[key] = url; else photos[key] = url;
    const thumb = document.getElementById("thumb-"+key);
    thumb.style.backgroundImage = `url(${url})`;
    thumb.textContent = "";
    thumb.classList.add("has-photo");
  };
  reader.readAsDataURL(file);
}

/* ---------------- inspection checklist table ---------------- */
function inspTable(sectionId, groups){
  let html = "";
  for(const [groupName, items] of Object.entries(groups)){
    html += `<div class="card"><h4><span class="swatch"></span>${groupName}</h4>`;
    items.forEach((item, idx)=>{
      const rid = `${sectionId}-${groupName}-${idx}`.replace(/\s/g,'');
      const isObj = typeof item === "object";
      const nameHtml = isObj ? `${item.en}<div class="insp-th">${item.th}</div>` : `${item}`;
      html += `
      <div class="insp-row" data-rid="${rid}" data-sec="${sectionId}">
        <div class="insp-name">${nameHtml}</div>
        <span class="remark-toggle" onclick="toggleRemark('${rid}')">+ Remark</span>
        ${photoBtn("insp:"+rid)}
        <div class="seg">
          <button data-v="pass" onclick="setInsp('${rid}','${sectionId}',this,'pass')">Pass</button>
          <button data-v="fail" onclick="setInsp('${rid}','${sectionId}',this,'fail')">Fail</button>
          <button data-v="na" onclick="setInsp('${rid}','${sectionId}',this,'na')">N/A</button>
        </div>
      </div>
      <div class="field" id="remark-${rid}" style="display:none;margin:6px 0 4px;"><textarea placeholder="รายละเอียด / หมายเหตุ..." style="min-height:44px;"></textarea></div>
      `;
    });
    html += `</div>`;
  }
  return html;
}
function toggleRemark(rid){
  const el = document.getElementById(`remark-${rid}`);
  el.style.display = el.style.display === "none" ? "block" : "none";
}
function setInsp(rid, sectionId, btn, val){
  const row = btn.closest(".insp-row");
  row.querySelectorAll(".seg button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  row.dataset.value = val;
  recomputeSection(sectionId);
  recomputeGlobalScore();
}
function recomputeSection(sectionId){
  const rows = document.querySelectorAll(`.insp-row[data-sec="${sectionId}"]`);
  let pass=0, fail=0, na=0, total=rows.length;
  rows.forEach(r=>{
    if(r.dataset.value==="pass") pass++;
    else if(r.dataset.value==="fail") fail++;
    else if(r.dataset.value==="na") na++;
  });
  state.scores[sectionId] = {pass, fail, na, total};
  const dot = document.getElementById(`dot-${sectionId}`);
  if(dot){
    dot.classList.remove("done","issue");
    if(fail>0) dot.classList.add("issue");
    else if(pass+na===total && total>0) dot.classList.add("done");
  }
}
function recomputeGlobalScore(){
  let weightedSum = 0, weightUsed = 0;
  sections.forEach(s=>{
    if(!s.weight) return;
    const sc = state.scores[s.id];
    if(!sc || sc.total===0) return;
    const scoreable = sc.pass + sc.fail;
    if(scoreable===0) return;
    const pct = sc.pass/scoreable;
    weightedSum += pct * s.weight;
    weightUsed += s.weight;
  });
  const scoreEl = document.getElementById("gaugeScore");
  const statusEl = document.getElementById("gaugeStatus");
  const arc = document.getElementById("gaugeArc");
  if(weightUsed===0){
    scoreEl.textContent="—"; statusEl.textContent="Not started";
    statusEl.style.color="#8A9B96"; statusEl.style.background="#EEF0EF";
    arc.setAttribute("stroke-dashoffset", 119.4);
    return;
  }
  const score = Math.round((weightedSum/weightUsed)*100);
  scoreEl.textContent = score;
  let status, color, bg;
  if(score>=90){status="Excellent";color="#2F8F5B";bg="#E7F4EC";}
  else if(score>=75){status="Good";color="#4C9F70";bg="#E7F4EC";}
  else if(score>=60){status="Monitor";color="#E0932F";bg="#FCF1E1";}
  else if(score>=40){status="Attention";color="#E0752F";bg="#FCEAE1";}
  else {status="Critical";color="#C24C3D";bg="#FBEAE7";}
  statusEl.textContent = status;
  statusEl.style.color = color;
  statusEl.style.background = bg;
  arc.setAttribute("stroke", color);
  arc.setAttribute("stroke-dashoffset", 119.4 * (1 - score/100));
}

      <td><input class="mono" value="${m.unit}" oninput="measurements[${i}].unit=this.value" placeholder="หน่วย"></td>
      <td><input value="${m.ref}" oninput="measurements[${i}].ref=this.value" placeholder="ค่าอ้างอิงที่ควรจะเป็น"></td>
      <td>
        <div class="seg" style="width:fit-content;">
          <button data-v="pass" class="${measResults[i]==='pass'?'active':''}" onclick="setMeasResult(${i},'pass',this)">Pass</button>
          <button data-v="fail" class="${measResults[i]==='fail'?'active':''}" onclick="setMeasResult(${i},'fail',this)">Fail</button>
        </div>

        <th style="width:26%">รายการที่วัด</th><th style="width:14%">ค่าที่วัดได้</th><th style="width:10%">หน่วย</th>
        <th style="width:32%">ค่าอ้างอิงที่ควรจะเป็น</th><th style="width:14%">ผ่าน/ไม่ผ่าน</th><th style="width:4%"></th>
      </tr></thead>
      <tbody id="measBody">${rows}</tbody>
    </table>
    </div>
    <button class="btn ghost small meas-add" onclick="addMeasRow()">+ เพิ่มรายการวัด</button>
  </div>`;
}

    body = `<div class="placeholder-note">หลักการ: ถ้า FusionSolar และ Visual Inspection (หมวด 04–08) ไม่พบความผิดปกติ ไม่จำเป็นต้องทำ Advanced Test ทุก String — เปิดหมวดนี้เฉพาะเมื่อพบ Fail หรือมีความเสี่ยงที่ต้องยืนยันเชิงตัวเลข</div>
    <div class="card" style="margin-top:14px"><h4><span class="swatch"></span>I-V Curve Test</h4>${fieldsGrid([["Instrument","เครื่องมือทดสอบ"],["String","สายสตริงที่ทดสอบ"],["Voc","แรงดันวงจรเปิด"]])}<div style="height:12px"></div>${fieldsGrid([["Isc","กระแสลัดวงจร"],["Vmp","แรงดันจุดพลังงานสูงสุด"],["Imp","กระแสจุดพลังงานสูงสุด"]])}<div style="height:12px"></div>${fieldsGrid([["Pmax","กำลังไฟฟ้าสูงสุด"],["STC Correction","ค่าปรับแก้ตามมาตรฐาน STC"],["Result","ผลสรุป"]])}
      <div style="height:12px"></div>
      ${photoBtn("ivCurveGraph", true)}
    </div>
    <div class="placeholder-note" style="margin-top:14px">รองรับในอนาคต: Thermal Imaging · Insulation Resistance · Grounding Measurement · Torque Check</div>`;
  }
  else if(s.id==="photo"){
    body = `<div class="card"><h4><span class="swatch"></span>Photo Evidence ตามหมวด</h4>
    ${photoReportCats.map(cat=>`
      <div class="pr-row">
        ${photoBtn(cat.key)}
        <div class="pr-name">${cat.en}<div class="insp-th" style="margin-top:1px;">${cat.th}</div></div>
        <input class="pr-note" type="text" placeholder="Finding / Recommendation สั้นๆ" oninput="photoNotes['${cat.key}']=this.value">
      </div>
    `).join("")}
    </div>
    <div class="placeholder-note">ครอบคลุมตั้งแต่หลังคา/แผง → แนวเดินสายและท่อร้อยสาย → อุปกรณ์หลัก (Inverter/Battery/ตู้ไฟ) → จุดความปลอดภัย (สายดิน) → เอกสารอ้างอิง (ป้ายรุ่น/หน้าจอมอนิเตอร์) — เพิ่มหมวดอื่นได้ถ้าหน้างานมีจุดเฉพาะ</div>`;
  }
  else if(s.id==="assess"){
    body = `<div class="card"><h4><span class="swatch"></span>Finding</h4><div class="field"><textarea placeholder="พบอะไรจากการตรวจ..." data-bind="assess.finding"></textarea></div></div>
    <div class="card"><h4><span class="swatch"></span>Observation</h4><div class="field"><textarea placeholder="สิ่งที่สังเกตเห็นแต่ยังไม่เป็นปัญหา..." data-bind="assess.observation"></textarea></div></div>
    <div class="card"><h4><span class="swatch"></span>Risk</h4><div class="field"><textarea placeholder="ความเสี่ยงที่อาจเกิดขึ้น..." data-bind="assess.risk"></textarea></div></div>
    <div class="card"><h4><span class="swatch"></span>Recommendation</h4><div class="field"><textarea placeholder="ควรดำเนินการอะไรต่อ..." data-bind="assess.recommendation"></textarea></div></div>
    <div class="placeholder-note">หลักภาษา: ไม่ขายของเกินจริง — ถ้าไม่จำเป็นต้องเปลี่ยนอุปกรณ์ ให้ระบุว่า "ระบบยังสามารถใช้งานต่อได้ตามปกติ ไม่พบประเด็นที่จำเป็นต้องเปลี่ยนอุปกรณ์ในขณะนี้"</div>`;
  }
  else if(s.id==="reco"){
    body = `
    <div class="rec-level immediate"><h5>Immediate Action</h5><p>ควรแก้ทันที — มีผลต่อความปลอดภัยหรือการทำงานของระบบ</p><textarea placeholder="รายการที่ต้องแก้ทันที..." data-bind="reco.immediate"></textarea></div>
    <div class="rec-level improve"><h5>Recommended Improvement</h5><p>ควรปรับปรุง — ยังใช้งานได้ แต่ควรวางแผนแก้ไข</p><textarea placeholder="รายการที่ควรปรับปรุง..." data-bind="reco.improve"></textarea></div>
    <div class="rec-level future"><h5>Future Opportunity</h5><p>พิจารณาในอนาคต — Battery Expansion / EV Charger / Energy Management</p><textarea placeholder="โอกาสต่อยอดในอนาคต..." data-bind="reco.future"></textarea></div>`;
  }
  else if(s.id==="history"){
    body = `<div class="card"><h4><span class="swatch"></span>ประวัติการตรวจย้อนหลัง</h4>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr style="text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);">
        <th style="padding:8px 6px;">วันที่ตรวจ</th><th style="padding:8px 6px;">Health Score</th><th style="padding:8px 6px;">เทียบครั้งก่อน</th><th style="padding:8px 6px;">หมายเหตุ</th>
      </tr></thead>
      <tbody>
        <tr><td colspan="4" style="padding:9px 6px;color:var(--ink-soft);text-align:center;">รอบตรวจถัดไปจะแสดงที่นี่หลัง Save</td></tr>
      </tbody>
    </table>
    </div>`;
  }
  else if(s.id==="ack"){
    body = `<div class="card"><h4><span class="swatch"></span>รับทราบผลการตรวจ</h4>${fieldsGrid([["Customer Name","ชื่อลูกค้า",{bind:"ack.customerName"}],["Engineer","วิศวกรผู้ตรวจ",{bind:"ack.engineer"}],["Date","วันที่",{bind:"ack.date",type:"date"}]])}
    <div style="height:14px"></div>
    <div class="field"><label>Signature</label>
      <div style="border:1px dashed var(--line);border-radius:8px;height:90px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;">แตะเพื่อเซ็นชื่อดิจิทัล</div>
    </div>
    </div>
    <div class="placeholder-note">เมื่อกด Generate Report จะออก PDF พร้อม QR Code สำหรับดู Online Report ในอนาคต</div>`;
  }

  return `
  <div class="sec-head">
    <div class="sec-eyebrow mono">${s.num} — ${s.eyebrow}</div>
    <div class="sec-title">${s.title}</div>
  </div>
  ${body}
  <div class="btn-row">
    <button class="btn ghost" onclick="stepSection(-1)">← ย้อนกลับ</button>
    <button class="btn primary" onclick="stepSection(1)">บันทึกและถัดไป →</button>
  </div>
  `;
}

const photoNotes = {};
const content = document.getElementById("content");
sections.forEach(s=>{
  const div = document.createElement("div");
  div.className = "section";
  div.id = "sec-" + s.id;
  div.innerHTML = sectionHTML(s);
  content.appendChild(div);
});

function showSection(id){
  document.querySelectorAll(".section").forEach(el=>el.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  document.querySelectorAll(".navlist li").forEach(li=>li.classList.toggle("active", li.dataset.id===id));
  window.scrollTo({top:0, behavior:"instant"});
}
function stepSection(dir){
  const idx = sections.findIndex(s=>document.getElementById("sec-"+s.id).classList.contains("active"));
  const next = sections[idx+dir];
  if(next) showSection(next.id);
}
showSection("cover");
recomputeGlobalScore();

/* =========================================================
   REPORT PREVIEW — ดึงข้อมูลจริงจาก formData / measurements / photos
   Layout เป็น 3 หน้า (พิมพ์แล้วขึ้นหน้าใหม่จริงด้วย CSS page-break)
========================================================= */
function catPct(sectionId){
  const sc = state.scores[sectionId];
  if(!sc) return null;
  const scoreable = sc.pass + sc.fail;
  if(scoreable===0) return null;
  return Math.round((sc.pass/scoreable)*100);
}
function barColor(pct){ return pct>=90?'#2F8F5B':pct>=75?'#4C9F70':pct>=60?'#E0932F':'#C24C3D'; }

function renderReportPages(){
  const c = formData.cover, a = formData.assess, r = formData.reco, ak = formData.ack;
  const score = document.getElementById("gaugeScore").textContent;
  const status = document.getElementById("gaugeStatus").textContent;
  const statusColor = document.getElementById("gaugeStatus").style.color || "#2F8F5B";
  const scorePct = isNaN(parseInt(score)) ? 0 : parseInt(score);
  const inspId = c.inspectionId ? "SHC-2026-"+String(c.inspectionId).padStart(4,"0").slice(-4) : "SHC-2026-0000";

  const catRows = [
    ["FusionSolar Performance","ประสิทธิภาพจากระบบมอนิเตอร์", null],
    ["PV / Physical Inspection","สภาพแผงและโครงสร้าง", catPct("pv")],
    ["Inverter Inspection","ตรวจอินเวอร์เตอร์", catPct("inverter")],
    ["Battery Inspection","ตรวจแบตเตอรี่", catPct("battery")],
    ["Electrical & Safety","ระบบไฟฟ้าและความปลอดภัย", catPct("electrical")],
  ].map(([en,th,pct])=>`
    <div class="rep-cat-row">
      <div class="name">${en}<div style="font-weight:400;color:var(--ink-soft);font-size:11px;">${th}</div></div>
      ${pct===null ? '<div class="bar-wrap" style="background:transparent;"></div><div class="pct">—</div>' : `<div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${barColor(pct)}"></div></div><div class="pct">${pct}%</div>`}
    </div>`).join("");

  const measRows = measurements.filter(m=>m.name).map((m,i)=>{
    const res = measResults[measurements.indexOf(m)];
    const badge = res==="pass" ? '<span class="rep-badge pass">Pass</span>' : res==="fail" ? '<span class="rep-badge fail">Fail</span>' : '<span class="rep-badge na">—</span>';
    return `<tr><td>${m.name}</td><td class="mono">${m.value||"—"}</td><td class="mono">${m.unit||"—"}</td><td>${m.ref||"—"}</td><td>${badge}</td></tr>`;
  }).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:14px;">ยังไม่มีข้อมูลการวัดค่า</td></tr>`;

  const photoGrid = photoReportCats.map(cat=>{
    const url = photos[cat.key];
    return `<figure><div class="ph" style="${url?`background-image:url(${url});`:''}">${url?'':'📷'}</div><figcaption>${cat.th}</figcaption></figure>`;
  }).join("");

  document.getElementById("reportPages").innerHTML = `
    <!-- PAGE 1 : Cover + Score + Category -->
    <div class="rep-page">
      <div class="rep-page-label no-print">หน้า 1 / 3 — Cover & Summary</div>
      <div class="rep-cover">
        <div class="rep-brand"><div class="mark">S</div><div><b>SYNNEX Solar Health Check</b><span>Installation & Maintenance Service</span></div></div>
        <div class="rep-id">Inspection ID<br><b style="color:var(--ink);font-size:12.5px;">${inspId}</b><br>${c.inspectionDate||"—"}</div>
      </div>
      <div class="rep-title">รายงานตรวจสุขภาพระบบโซลาร์</div>
      <div class="rep-sub">Solar System Health Check Report — ลูกค้า: ${c.customerName||"—"} · ไซต์: ${c.site||"—"} · ${c.inverterModel||"—"} ${c.batteryModel?('+ '+c.batteryModel):''}</div>
      <div class="rep-score-block">
        <div class="rep-score-circle" style="background:conic-gradient(${statusColor} 0% ${scorePct}%, #E4E9E8 ${scorePct}% 100%);"><div class="inner"><b>${score}</b><span>/ 100</span></div></div>
        <div class="rep-score-text"><b>${status}<span class="rep-pill" style="background:${statusColor}">${status}</span></b>
        <p>${c.keyFindings || 'ยังไม่ได้กรอกสรุปประเด็นสำคัญในหมวด Executive Summary'}</p></div>
      </div>
      <div class="rep-section"><h3>ผลตรวจแยกตามหมวด · Category Results</h3>${catRows}</div>
    </div>

    <!-- PAGE 2 : Measurement + Photo evidence -->
    <div class="rep-page">
      <div class="rep-page-label no-print">หน้า 2 / 3 — Measurement & Photo Evidence</div>
      <div class="rep-section"><h3>ผลการวัดค่าทางไฟฟ้า · Measurement Results</h3>
        <table class="rep-meas-table"><thead><tr><th>รายการที่วัด</th><th>ค่าที่วัดได้</th><th>หน่วย</th><th>ค่าอ้างอิง</th><th>ผล</th></tr></thead>
        <tbody>${measRows}</tbody></table>
      </div>
      <div class="rep-section"><h3>หลักฐานภาพประกอบ · Photo Evidence</h3><div class="rep-photo-grid">${photoGrid}</div></div>
    </div>

    <!-- PAGE 3 : Assessment + Recommendation + Signature -->
    <div class="rep-page">
      <div class="rep-page-label no-print">หน้า 3 / 3 — Assessment & Sign-off</div>
      <div class="rep-section"><h3>ความเห็นวิศวกร · Engineer Assessment</h3>
        <p style="font-size:12.5px;"><b>Finding:</b> ${a.finding||"—"}</p>
        <p style="font-size:12.5px;"><b>Observation:</b> ${a.observation||"—"}</p>
        <p style="font-size:12.5px;"><b>Risk:</b> ${a.risk||"—"}</p>
      </div>
      <div class="rep-section"><h3>ข้อเสนอแนะ · Recommendation</h3>
        <div class="rep-reco immediate"><b>Immediate Action</b>${r.immediate||"ไม่พบรายการที่ต้องดำเนินการเร่งด่วนในรอบตรวจนี้"}</div>
        <div class="rep-reco improve"><b>Recommended Improvement</b>${r.improve||"—"}</div>
        <div class="rep-reco future"><b>Future Opportunity</b>${r.future||"—"}</div>
        <div class="rep-quote">"${a.recommendation || 'ระบบยังสามารถใช้งานต่อได้ตามปกติ ไม่พบประเด็นที่จำเป็นต้องเปลี่ยนอุปกรณ์ในขณะนี้'}" — ความเห็นวิศวกรผู้ตรวจ</div>
      </div>
      <div class="rep-sign">
        <div><b>วิศวกรผู้ตรวจ · Engineer</b>${ak.engineer||c.engineer||"______________________"}<br>วันที่: ${ak.date||c.inspectionDate||"—"}</div>
        <div><b>รับทราบโดยลูกค้า · Customer Acknowledgement</b>${ak.customerName||c.customerName||"______________________"}<br>วันที่: ${ak.date||"—"}</div>
      </div>
      <div class="rep-footer">
        <div class="note">รายงานนี้จัดทำโดยทีม Installation & Maintenance Service, SYNNEX (Thailand) — สแกน QR เพื่อดูรายงานฉบับออนไลน์และประวัติการตรวจย้อนหลัง</div>
        <div class="rep-qr">QR<br>CODE</div>
      </div>
    </div>
  `;
}
function openReport(){ renderReportPages(); document.body.classList.add("report-mode"); window.scrollTo({top:0,behavior:"instant"}); }
function closeReport(){ document.body.classList.remove("report-mode"); }
</script>
</body>
</html>
