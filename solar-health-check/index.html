<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNNEX Solar Health Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#10222B;
    --ink-soft:#3D5560;
    --panel:#EEF2F1;
    --surface:#FFFFFF;
    --line:#DDE4E2;
    --amber:#F2A93B;
    --teal:#1B7A6E;
    --pass:#2F8F5B;
    --warn:#E0932F;
    --fail:#C24C3D;
    --pass-bg:#E7F4EC;
    --warn-bg:#FCF1E1;
    --fail-bg:#FBEAE7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{display:none;min-height:100vh;}
  body.view-form .app{display:flex;}
  body.report-mode .app{display:none;}

  .dashboard-view{display:none;}
  body.view-dashboard .dashboard-view{display:block;}
  body.report-mode .dashboard-view{display:none;}
  .dash-shell{max-width:1040px;margin:0 auto;padding:36px 24px 80px;}
  .dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .dash-header .brand-row{display:flex;align-items:center;gap:12px;}
  .dash-header .brand-row .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--amber),#C97C1E);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:16px;}
  .dash-header .brand-row .brand-logo{height:32px;width:auto;object-fit:contain;flex-shrink:0;}
  .dash-header .brand-row b{font-family:'Space Grotesk';font-size:19px;display:block;}
  .dash-header .brand-row span{font-size:12px;color:var(--ink-soft);}
  .dash-kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  @media(max-width:640px){.dash-kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .dash-list{display:flex;flex-direction:column;gap:8px;}
  .dash-controls{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .dash-controls input[type="text"]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Inter';background:var(--surface);}
  .dash-controls select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Inter';background:var(--surface);}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .vt-btn{border:none;background:var(--surface);padding:8px 12px;cursor:pointer;font-size:14px;color:var(--ink-soft);border-right:1px solid var(--line);}
  .vt-btn:last-child{border-right:none;}
  .vt-btn.active{background:var(--ink);color:#fff;}
  .site-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .15s;position:relative;}
  .site-card:hover{border-color:var(--teal);}
  .site-row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .15s;}
  .site-row:hover{border-color:var(--teal);}
  .site-del{margin-left:auto;flex-shrink:0;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--fail);cursor:pointer;font-size:13px;}
  .site-del:hover{background:var(--fail-bg);}
  .site-score{width:48px;height:48px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:16px;}
  .site-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .site-info b{font-family:'Space Grotesk';font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .site-info span{font-size:11.5px;color:var(--ink-soft);}
  .site-date{font-family:'IBM Plex Mono';}
  .rail{
    width:250px;flex-shrink:0;background:var(--ink);color:#CFE0DC;
    padding:22px 14px 22px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .rail-brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:14px;}
  .rail-brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--amber),#C97C1E);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:14px;}
  .rail-brand .brand-logo{height:26px;width:auto;object-fit:contain;flex-shrink:0;}
  .rail-brand .txt{line-height:1.15;}
  .rail-brand .txt b{font-family:'Space Grotesk';font-size:13.5px;color:#fff;display:block;}
  .rail-brand .txt span{font-size:10.5px;color:#9FB6B0;letter-spacing:.03em;}

  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .navlist li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#B9CBC6;transition:background .15s,color .15s;}
  .navlist li:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navlist li.active{background:rgba(242,169,59,0.14);color:#fff;}
  .navlist li.active .num{background:var(--amber);color:var(--ink);}
  .navlist .num{
    width:20px;height:20px;flex-shrink:0;border-radius:5px;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10px;color:#9FB6B0;
  }
  .navlist .status-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#4A5F5A;flex-shrink:0;}
  .navlist .status-dot.done{background:var(--pass);}
  .navlist .status-dot.issue{background:var(--fail);}

  .main{flex:1;min-width:0;}
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  }
  .topbar .id-block{margin-right:auto;}
  .topbar .id-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .topbar .id-block .val{font-family:'Space Grotesk';font-weight:600;font-size:15px;}
  .gauge-wrap{display:flex;align-items:center;gap:12px;}
  .gauge-score{font-family:'Space Grotesk';font-weight:700;font-size:22px;}
  .gauge-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.02em;}

  .content{padding:26px 28px 80px;max-width:880px;}
  .section{display:none;}
  .section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .sec-head{margin-bottom:20px;}
  .sec-eyebrow{font-family:'IBM Plex Mono';font-size:11px;color:var(--teal);letter-spacing:.06em;}
  .sec-title{font-family:'Space Grotesk';font-size:23px;font-weight:700;margin:2px 0 6px;}
  .sec-sub{font-size:13px;color:var(--ink-soft);line-height:1.5;max-width:60ch;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h4{font-family:'Space Grotesk';font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card h4 .swatch{width:6px;height:16px;border-radius:3px;background:var(--teal);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  /* ---- mobile / tablet layout ---- */
  @media(max-width:860px){
    .app{flex-direction:column;}
    .rail{width:100%;height:auto;position:relative;padding:14px 14px 10px;}
    .rail-brand{margin-bottom:10px;padding-bottom:10px;}
    .navlist{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
    .navlist li{flex-shrink:0;white-space:nowrap;}
    .navlist .status-dot{margin-left:6px;}
    .content{padding:16px 14px 60px;}
    .topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
    .topbar .id-block{flex:1 1 100%;order:0;}
    .topbar-actions{flex-wrap:wrap;width:100%;}
    .tb-btn{flex:1 1 auto;justify-content:center;}
    .insp-row{flex-wrap:wrap;row-gap:8px;}
    .insp-name{flex:1 1 100%;}
    .dash-shell{padding:20px 14px 60px;}
    .dash-header{flex-wrap:wrap;gap:12px;}
    .dash-controls{flex-direction:column;align-items:stretch;}
    .rep-page{padding:24px 18px;}
    .report-shell{padding:16px 10px 60px;}
  }

  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:'Inter';
    background:#FBFCFC;color:var(--ink);
  }
  .field input.mono,.field textarea.mono{font-family:'IBM Plex Mono';}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .field textarea{resize:vertical;min-height:64px;}

  .insp-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .insp-row:last-child{border-bottom:none;}
  .insp-name{flex:1;font-size:13.5px;font-weight:500;}
  .insp-name .insp-th{font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;}
  .seg button{
    border:none;background:var(--surface);padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;
    color:var(--ink-soft);font-family:'Inter';border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button[data-v="pass"].active{background:var(--pass-bg);color:var(--pass);}
  .seg button[data-v="fail"].active{background:var(--fail-bg);color:var(--fail);}
  .seg button[data-v="na"].active{background:#EEF0EF;color:var(--ink-soft);}

  .photo-btn{
    width:34px;height:34px;border-radius:7px;border:1px dashed var(--line);background:#FBFCFC;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink-soft);
    font-size:14px;overflow:hidden;background-size:cover;background-position:center;position:relative;
  }
  .photo-btn.has-photo{border-style:solid;border-color:var(--teal);color:transparent;}
  .photo-btn.has-photo::after{content:"✓";position:absolute;bottom:-2px;right:-2px;background:var(--teal);color:#fff;
    width:14px;height:14px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;}
  .photo-btn-lg{width:100%;height:80px;border-radius:8px;}
  .remark-toggle{font-size:11px;color:var(--teal);cursor:pointer;flex-shrink:0;text-decoration:underline;text-underline-offset:2px;}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(16,34,43,0.85);z-index:60;align-items:center;justify-content:center;padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox-inner{max-width:min(90vw,600px);display:flex;flex-direction:column;gap:14px;align-items:center;}
  .lightbox-inner img{max-width:100%;max-height:70vh;border-radius:10px;background:#fff;object-fit:contain;}
  .lightbox-actions{display:flex;gap:10px;}
  .lightbox-actions .tb-btn{background:#fff;}

  .photo-choice{display:none;position:fixed;inset:0;background:rgba(16,34,43,0.6);z-index:65;align-items:flex-end;justify-content:center;padding:20px;}
  .photo-choice.open{display:flex;}
  .photo-choice-inner{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;}
  .photo-choice-inner .tb-btn{width:100%;justify-content:center;padding:12px;font-size:14px;}

  .camera-modal{display:none;position:fixed;inset:0;background:#000;z-index:70;flex-direction:column;overflow:hidden;}
  .camera-modal.open{display:flex;}
  .camera-modal video{flex:1 1 auto;min-height:0;width:100%;object-fit:cover;background:#000;}
  .camera-topbar{position:absolute;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(to bottom, rgba(0,0,0,.65), transparent);display:none;justify-content:flex-end;z-index:2;}
  .camera-topbar select{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:8px;padding:8px 10px;font-size:12px;max-width:220px;}
  .camera-actions{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;background:#000;gap:16px;}
  .camera-actions .tb-btn{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3);flex:0 0 auto;}
  .cam-shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.5);cursor:pointer;flex-shrink:0;}
  .camera-hint{color:#fff;opacity:.7;font-size:11px;text-align:center;padding:8px 0 2px;flex-shrink:0;}

  .rec-level{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin-bottom:14px;}
  .rec-level.immediate{border-color:var(--fail);}
  .rec-level.improve{border-color:var(--warn);}
  .rec-level.future{border-color:var(--teal);}
  .rec-level h5{margin:0 0 3px;font-family:'Space Grotesk';font-size:13.5px;}
  .rec-level p{margin:0 0 8px;font-size:12px;color:var(--ink-soft);}
  .rec-level textarea{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:'Inter';}

  .btn-row{display:flex;justify-content:space-between;margin-top:24px;}
  .btn{font-family:'Inter';font-weight:600;font-size:13px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.primary:hover{background:#1c3540;}
  .btn.small{padding:6px 12px;font-size:12px;}

  .weight-note{font-size:11px;color:var(--ink-soft);background:#FBFCFC;border:1px dashed var(--line);padding:10px 12px;border-radius:8px;margin-top:4px;}
  .placeholder-note{font-size:12px;color:var(--ink-soft);background:#FBFCFC;border:1px dashed var(--line);border-radius:8px;padding:12px 14px;}
  .field-th{display:block;font-weight:400;font-size:10.5px;color:#8FA39D;margin-top:2px;letter-spacing:0;}

  .topbar-actions{display:flex;gap:8px;}
  .tb-btn{
    display:flex;align-items:center;gap:6px;font-family:'Inter';font-weight:600;font-size:12.5px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);
  }
  .tb-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---- measurement table ---- */
  .meas-table{width:100%;border-collapse:collapse;}
  .meas-table th{text-align:left;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px;font-weight:600;}
  .meas-table td{padding:5px 8px;vertical-align:middle;}
  .meas-table input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:'Inter';background:#FBFCFC;}
  .meas-table input.mono{font-family:'IBM Plex Mono';}
  .meas-table tr{border-bottom:1px solid var(--line);}
  .meas-del{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--fail);cursor:pointer;font-size:13px;line-height:1;}
  .meas-add{margin-top:12px;}

  /* ---- photo report grid ---- */
  .pr-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .pr-row:last-child{border-bottom:none;}
  .pr-photo{width:44px;height:44px;border-radius:8px;flex-shrink:0;}
  .pr-name{flex:0 0 150px;font-size:13px;font-weight:500;}
  .pr-note{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;font-family:'Inter';background:#FBFCFC;}

  /* ---- report preview ---- */
  .report-view{display:none;}
  body.report-mode .app{display:none;}
  body.report-mode .report-view{display:block;}
  .report-shell{max-width:840px;margin:0 auto;padding:30px 20px 90px;}
  .report-toolbar{position:sticky;top:0;background:var(--panel);padding:14px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;z-index:5;}
  .rep-page{background:#fff;border:1px solid var(--line);border-radius:12px;padding:40px 44px;box-shadow:0 1px 3px rgba(16,34,43,0.06);margin-bottom:22px;}
  .rep-page-label{font-family:'IBM Plex Mono';font-size:10px;color:var(--ink-soft);margin:0 0 8px;letter-spacing:.05em;}
  .rep-cover{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:26px;}
  .rep-brand{display:flex;align-items:center;gap:10px;}
  .rep-brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#C97C1E);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--ink);}
  .rep-brand .rep-logo{height:30px;width:auto;object-fit:contain;flex-shrink:0;}
  .rep-brand b{font-family:'Space Grotesk';font-size:15px;display:block;}
  .rep-brand span{font-size:10.5px;color:var(--ink-soft);}
  .rep-id{text-align:right;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}
  .rep-title{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:0 0 4px;}
  .rep-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:26px;}

  .rep-score-block{display:flex;align-items:center;gap:22px;background:var(--panel);border-radius:12px;padding:20px 24px;margin-bottom:26px;}
  .rep-score-circle{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rep-score-circle .inner{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .rep-score-circle .inner b{font-family:'Space Grotesk';font-size:20px;}
  .rep-score-circle .inner span{font-size:8.5px;color:var(--ink-soft);}
  .rep-score-text b{font-family:'Space Grotesk';font-size:15px;}
  .rep-score-text p{font-size:12px;color:var(--ink-soft);margin:4px 0 0;line-height:1.5;}
  .rep-pill{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--pass);padding:3px 10px;border-radius:99px;margin-left:8px;vertical-align:middle;}

  .rep-section{margin-bottom:24px;}
  .rep-section h3{font-family:'Space Grotesk';font-size:14.5px;border-left:3px solid var(--teal);padding-left:10px;margin:0 0 10px;}
  .rep-cat-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .rep-cat-row:last-child{border-bottom:none;}
  .rep-cat-row .name{flex:1;font-weight:600;}
  .rep-cat-row .bar-wrap{flex:2;height:6px;background:#E4E9E8;border-radius:99px;overflow:hidden;}
  .rep-cat-row .bar{height:100%;border-radius:99px;background:var(--pass);}
  .rep-cat-row .pct{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);width:44px;text-align:right;}

  .rep-meas-table{width:100%;border-collapse:collapse;font-size:12px;}
  .rep-meas-table th{text-align:left;padding:6px 8px;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--ink);}
  .rep-meas-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .rep-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
  .rep-badge.pass{background:var(--pass-bg);color:var(--pass);}
  .rep-badge.fail{background:var(--fail-bg);color:var(--fail);}
  .rep-badge.na{background:#EEF0EF;color:var(--ink-soft);}

  .rep-photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .rep-photo-grid figure{margin:0;}
  .rep-photo-grid .ph{aspect-ratio:1;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#B7C4C0;background-size:cover;background-position:center;}
  .rep-photo-grid figcaption{font-size:10px;color:var(--ink-soft);margin-top:4px;text-align:center;}

  .rep-reco{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:10px;font-size:12.5px;}
  .rep-reco.immediate{border-color:var(--fail);}
  .rep-reco.improve{border-color:var(--warn);}
  .rep-reco.future{border-color:var(--teal);}
  .rep-reco b{display:block;font-family:'Space Grotesk';font-size:12.5px;}

  .rep-quote{background:var(--panel);border-radius:8px;padding:14px 16px;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:8px;}
  .rep-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px;}
  .rep-sign div{border-top:1px solid var(--line);padding-top:8px;font-size:11.5px;color:var(--ink-soft);}
  .rep-sign div b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px;}
  .rep-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);}
  .rep-qr{width:54px;height:54px;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);text-align:center;}
  .rep-footer .note{font-size:10.5px;color:var(--ink-soft);max-width:60ch;}

  @media print{
    .no-print{display:none !important;}
    .report-shell{padding:0;max-width:none;}
    .rep-page{border:none;box-shadow:none;border-radius:0;padding:0;page-break-after:always;margin-bottom:0;}
    .rep-page:last-child{page-break-after:auto;}
    body{background:#fff;}
  }

  ::selection{background:var(--amber);color:var(--ink);}
</style>
</head>

// delegated listener: writes any input/textarea with data-bind into formData
document.addEventListener("input", (e)=>{
  const el = e.target;
  const path = el.dataset && el.dataset.bind;
  if(!path) return;
  const [group, key] = path.split(".");
  if(!formData[group]) formData[group] = {};
  formData[group][key] = el.value;
  // ฟิลด์ที่ผูก data-bind เดียวกัน (เช่น Inverter Model ใน Cover กับ System Info) อัปเดตพร้อมกันแบบสด
  document.querySelectorAll(`[data-bind="${path}"]`).forEach(other=>{ if(other!==el) other.value = el.value; });
  syncCrossLinks();
});

/* ---------------- in-page camera (getUserMedia) — เชื่อถือได้กว่า input capture บนมือถือ/เดสก์ท็อป ---------------- */
let cameraStream = null;
let pendingCameraKey = null;
async function openCamera(key){
  pendingCameraKey = key;
  const modal = document.getElementById("cameraModal");
  const hint = document.getElementById("cameraHint");
  document.getElementById("cameraTopbar").style.display = "none";
  modal.classList.add("open");
  hint.textContent = "กำลังเปิดกล้อง...";
  try{
    await startCameraStream({ facingMode: { ideal: "environment" } });
    hint.textContent = "";
    await populateCameraDevices();
  } catch(err){
    // เปิดกล้องไม่ได้ (ไม่อนุญาต/ไม่มีกล้อง/เบราว์เซอร์ไม่รองรับ) — สลับไปใช้ input capture แบบเดิมแทน
    closeCameraModal();
    const fallback = document.getElementById("filecam-"+key);
    if(fallback) fallback.click();
  }
}
async function startCameraStream(videoConstraints){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); }
  const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
  cameraStream = stream;
  const video = document.getElementById("cameraVideo");
  video.srcObject = stream;
  await video.play();
}
async function populateCameraDevices(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d=>d.kind==="videoinput");
    const topbar = document.getElementById("cameraTopbar");
    const select = document.getElementById("cameraDeviceSelect");
    if(cams.length > 1){
      select.innerHTML = cams.map((d,i)=>`<option value="${d.deviceId}">${d.label || ("กล้อง " + (i+1))}</option>`).join("");
      const track = cameraStream.getVideoTracks()[0];
      const settings = track && track.getSettings ? track.getSettings() : {};
      if(settings.deviceId) select.value = settings.deviceId;
      topbar.style.display = "flex";
    } else {
      topbar.style.display = "none";
    }
  } catch(e){ /* enumerateDevices ไม่สำเร็จ ไม่ใช่เรื่องคอขวด ปล่อยผ่าน */ }
}
async function switchCameraDevice(deviceId){
  const hint = document.getElementById("cameraHint");
  hint.textContent = "กำลังสลับกล้อง...";
  try{
    await startCameraStream({ deviceId: { exact: deviceId } });
    hint.textContent = "";
  } catch(err){
    hint.textContent = "สลับกล้องไม่สำเร็จ";
  }
}
function closeCameraModal(){
  document.getElementById("cameraModal").classList.remove("open");
  document.getElementById("cameraTopbar").style.display = "none";
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  pendingCameraKey = null;
}
function captureCameraPhoto(){
  const key = pendingCameraKey;
  if(!key) return;
  const video = document.getElementById("cameraVideo");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
  closeCameraModal();
  if(key.startsWith("insp:")) inspPhotos[key] = dataUrl; else photos[key] = dataUrl;
  const thumb = document.getElementById("thumb-"+key);
  if(thumb){ thumb.style.backgroundImage = `url(${dataUrl})`; thumb.textContent = ""; thumb.classList.add("has-photo"); }
  if(currentLightboxKey===key) document.getElementById("lightboxImg").src = dataUrl;
}

function handlePhotoUpload(e, key){

/* ---------------- digital signature pad (หมวด 14) ---------------- */
function initSignaturePad(){
  const canvas = document.getElementById("sigPad");
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width || 600;
  canvas.height = rect.height || 120;
  const ctx = canvas.getContext("2d");
  if(formData.ack.signature){
    const img = new Image();
    img.onload = ()=>ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = formData.ack.signature;
  }
  let drawing = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - r.left, y: t.clientY - r.top};
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = "#10222B"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.lineTo(p.x, p.y); ctx.stroke();
    e.preventDefault();
  }
  function end(){ if(!drawing) return; drawing = false; formData.ack.signature = canvas.toDataURL("image/png"); }
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignature(){
  const canvas = document.getElementById("sigPad");
  if(!canvas) return;
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  formData.ack.signature = "";
}
function setInsp(rid, sectionId, btn, val){
  const row = btn.closest(".insp-row");
  row.querySelectorAll(".seg button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  row.dataset.value = val;
  inspResults[rid] = val;
  recomputeSection(sectionId);
  recomputeGlobalScore();
}
function recomputeAllChecklists(){
  ["pv","inverter","battery","electrical"].forEach(id=>recomputeSection(id));
  recomputeGlobalScore();
}
function recomputeSection(sectionId){
  const rows = document.querySelectorAll(`.insp-row[data-sec="${sectionId}"]`);
  let pass=0, fail=0, na=0, total=rows.length;
  rows.forEach(r=>{
    if(r.dataset.value==="pass") pass++;
    else if(r.dataset.value==="fail") fail++;
    else if(r.dataset.value==="na") na++;
  });
  state.scores[sectionId] = {pass, fail, na, total};
  const dot = document.getElementById(`dot-${sectionId}`);
  if(dot){
    dot.classList.remove("done","issue");
    if(fail>0) dot.classList.add("issue");
    else if(pass+na===total && total>0) dot.classList.add("done");
  }
}
function recomputeGlobalScore(){
  let weightedSum = 0, weightUsed = 0;
  sections.forEach(s=>{
    if(!s.weight) return;
    const sc = state.scores[s.id];
    if(!sc || sc.total===0) return;
    const scoreable = sc.pass + sc.fail;
    if(scoreable===0) return;
    const pct = sc.pass/scoreable;
    weightedSum += pct * s.weight;
    weightUsed += s.weight;
  });
  const scoreEl = document.getElementById("gaugeScore");
  const statusEl = document.getElementById("gaugeStatus");
  const arc = document.getElementById("gaugeArc");
  if(weightUsed===0){
    scoreEl.textContent="—"; statusEl.textContent="Not started";
    statusEl.style.color="#8A9B96"; statusEl.style.background="#EEF0EF";
    arc.setAttribute("stroke-dashoffset", 119.4);
    return;
  }
  const score = Math.round((weightedSum/weightUsed)*100);
  scoreEl.textContent = score;
  let status, color, bg;
  if(score>=90){status="Excellent";color="#2F8F5B";bg="#E7F4EC";}
  else if(score>=75){status="Good";color="#4C9F70";bg="#E7F4EC";}
  else if(score>=60){status="Monitor";color="#E0932F";bg="#FCF1E1";}
  else if(score>=40){status="Attention";color="#E0752F";bg="#FCEAE1";}
  else {status="Critical";color="#C24C3D";bg="#FBEAE7";}
  statusEl.textContent = status;
  statusEl.style.color = color;
  statusEl.style.background = bg;
  arc.setAttribute("stroke", color);
  arc.setAttribute("stroke-dashoffset", 119.4 * (1 - score/100));
}

function addMeasRow(){ measurements.push({name:"",value:"",unit:"",ref:""}); rerenderSection("electrical"); }
function removeMeasRow(i){ measurements.splice(i,1); const nr={}; Object.keys(measResults).forEach(k=>{if(+k<i)nr[k]=measResults[k]; else if(+k>i)nr[k-1]=measResults[k];}); measResults=nr; rerenderSection("electrical"); }
function setMeasResult(i,val,btn){ measResults[i]=val; btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); }
function rerenderSection(id){
  const s = sections.find(x=>x.id===id);
  document.getElementById("sec-"+id).innerHTML = sectionHTML(s);
}

function showSection(id){
  document.querySelectorAll(".section").forEach(el=>el.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  document.querySelectorAll(".navlist li").forEach(li=>li.classList.toggle("active", li.dataset.id===id));
  if(id==="ack") initSignaturePad();
  window.scrollTo({top:0, behavior:"instant"});
}
function stepSection(dir){
  const idx = sections.findIndex(s=>document.getElementById("sec-"+s.id).classList.contains("active"));
  const next = sections[idx+dir];
  if(next) showSection(next.id);
}
showSection("cover");
recomputeAllChecklists();
showView("dashboard");

function showView(name){
  document.body.classList.remove("view-dashboard","view-form");
  document.body.classList.add("view-"+name);
  if(name==="dashboard") loadDashboard();
  if(name==="form") loadHistory();
  window.scrollTo({top:0,behavior:"instant"});
}

let dashboardSites = [];
let dashViewMode = "grid";
let dashFilterStatus = "all";
let dashSearchQuery = "";

function statusFromScore(score){
  if(isNaN(score)) return null;
  if(score>=90) return "excellent";
  if(score>=75) return "good";
  if(score>=60) return "monitor";
  if(score>=40) return "attention";
  return "critical";
}
function scoreColor(score){
  return isNaN(score) ? "#8A9B96" : score>=90?"#2F8F5B":score>=75?"#4C9F70":score>=60?"#E0932F":"#C24C3D";
}

async function loadDashboard(){
  const grid = document.getElementById("dashGrid");
  const kpis = document.getElementById("dashKpis");
  if(!backendReady()){
    grid.innerHTML = `<div class="placeholder-note">ยังไม่ได้ตั้งค่า API_URL ในโค้ด — เชื่อม backend ก่อนเพื่อดูรายการไซต์ทั้งหมด</div>`;
    kpis.innerHTML = "";
    return;
  }
  grid.innerHTML = `<div class="placeholder-note">กำลังโหลดรายการไซต์...</div>`;
  try{
    const r = await apiGet({tool:TOOL_NAME, action:"list"});
    if(!r.ok || !r.records.length){
      dashboardSites = [];
      grid.innerHTML = `<div class="placeholder-note">ยังไม่มีไซต์ที่บันทึกไว้ — กด "+ สร้างไซต์ใหม่" เพื่อเริ่มไซต์แรก</div>`;
      kpis.innerHTML = "";
      return;
    }
    const bySite = {};
    r.records.forEach(rec=>{
      const key = rec.site || rec.customerName || "ไม่ระบุชื่อไซต์";
      if(!bySite[key] || new Date(rec.timestamp) > new Date(bySite[key].timestamp)) bySite[key] = {...rec, name:key};
    });
    dashboardSites = Object.values(bySite).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    const scores = dashboardSites.map(s=>parseInt(s.score)).filter(n=>!isNaN(n));
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : "—";
    const attention = dashboardSites.filter(s=>!isNaN(parseInt(s.score)) && parseInt(s.score)<60).length;
    kpis.innerHTML = `
      <div class="kpi"><div class="k-lbl">ไซต์ทั้งหมด</div><div class="k-val">${dashboardSites.length}</div></div>
      <div class="kpi"><div class="k-lbl">คะแนนเฉลี่ย</div><div class="k-val">${avg}</div></div>
      <div class="kpi"><div class="k-lbl">ควรติดตาม (ต่ำกว่า 60)</div><div class="k-val" style="color:var(--fail)">${attention}</div></div>
      <div class="kpi"><div class="k-lbl">บันทึกล่าสุด</div><div class="k-val" style="font-size:14px;">${new Date(dashboardSites[0].timestamp).toLocaleDateString('th-TH')}</div></div>
    `;
    renderDashboardGrid();
  } catch(err){
    grid.innerHTML = `<div class="placeholder-note">โหลดรายการไซต์ไม่สำเร็จ: ${err.message}</div>`;
  }
}

function renderDashboardGrid(){
  const grid = document.getElementById("dashGrid");
  const q = dashSearchQuery.trim().toLowerCase();
  const filtered = dashboardSites.filter(s=>{
    if(q && !(s.name.toLowerCase().includes(q) || (s.customerName||"").toLowerCase().includes(q))) return false;
    if(dashFilterStatus!=="all" && statusFromScore(parseInt(s.score))!==dashFilterStatus) return false;
    return true;
  });
  if(!filtered.length){ grid.innerHTML = `<div class="placeholder-note">ไม่พบไซต์ที่ตรงกับตัวกรอง</div>`; return; }
  if(dashViewMode==="grid"){
    grid.className = "dash-grid";
    grid.innerHTML = filtered.map(siteCardHTML).join("");
  } else {
    grid.className = "dash-list";
    grid.innerHTML = filtered.map(siteRowHTML).join("");
  }
}
function siteCardHTML(s){
  const score = parseInt(s.score);

    <button class="site-del" onclick="deleteSite('${safeName}', event)" title="ลบไซต์">🗑</button>

}

function setDashView(mode){

async function deleteSite(siteName, evt){
  evt.stopPropagation();
  if(!confirm(`ลบไซต์ "${siteName}" พร้อมประวัติการตรวจทั้งหมดของไซต์นี้?\nการลบนี้ไม่สามารถย้อนกลับได้`)) return;
  try{
    const r = await apiPost({tool:TOOL_NAME, action:"delete", site:siteName});
    if(r.ok) loadDashboard();

  } catch(err){
    alert("เกิดข้อผิดพลาด: " + err.message);
  }
}

/* ---------------- save real PDF file (html2canvas + jsPDF, ไม่ใช้ browser print) ---------------- */
function sanitizeFilename(s){
  return String(s||"").trim().replace(/[^a-zA-Z0-9ก-๙_-]+/g,"_").replace(/_+/g,"_").slice(0,60);
}
function setPdfStatus(msg, isError){
  const el = document.getElementById("pdfStatus");
  el.textContent = msg;
  el.style.color = isError ? "var(--fail)" : "var(--teal)";
}
async function saveAsPDF(){
  const btn = document.getElementById("savePdfBtn");
  btn.disabled = true;
  setPdfStatus("กำลังสร้างไฟล์ PDF...");
  try{
    const { jsPDF } = window.jspdf;
    const pages = document.querySelectorAll("#reportPages .rep-page");
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    for(let i=0; i<pages.length; i++){
      const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const ratio = canvas.height / canvas.width;
      let w = pageWidth, h = pageWidth * ratio;
      if(h > pageHeight){ h = pageHeight; w = pageHeight / ratio; }
      const x = (pageWidth - w) / 2;
      if(i > 0) pdf.addPage();
      pdf.addImage(imgData, "JPEG", x, 0, w, h);
    }
    const c = formData.cover;
    const jobNo = sanitizeFilename(c.tsJobNo) || "TSJOB";
    const site = sanitizeFilename(c.site || c.customerName) || "Site";
    const dateStr = sanitizeFilename(c.inspectionDate || new Date().toISOString().slice(0,10));
    pdf.save(`${jobNo}_${site}_${dateStr}.pdf`);
    setPdfStatus("✓ บันทึก PDF แล้ว");
  } catch(err){
    setPdfStatus("สร้าง PDF ไม่สำเร็จ: " + err.message, true);
  } finally {
    btn.disabled = false;
  }
}

/* =========================================================
   SAVE / LOAD — เชื่อมกับ Google Apps Script backend
   (ใช้ Content-Type: text/plain ตอน POST เพื่อเลี่ยง CORS preflight
    ซึ่ง Apps Script Web App ไม่รองรับ OPTIONS โดยตรง)
========================================================= */
function setSaveStatus(msg, isError){
  const el = document.getElementById("saveStatus");
  el.textContent = msg;
  el.style.color = isError ? "var(--fail)" : "var(--teal)";
}

async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  return res.json();
}
async function apiGet(params){
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  return res.json();
}

// อัปโหลดรูปทั้งหมดที่ยังเป็น dataURL (ยังไม่เคยขึ้น Drive) แล้วแทนที่ด้วย URL จริง
async function uploadPendingPhotos(){
  const siteName = formData.cover.site || formData.cover.customerName || "Unsorted";
  const jobs = [];
  Object.keys(photos).forEach(key=>{
    if(photos[key] && photos[key].startsWith("data:")){
      jobs.push(apiPost({tool:TOOL_NAME, action:"uploadPhoto", filename:key+".jpg", base64:photos[key], site:siteName})
        .then(r=>{ if(r.ok) photos[key] = r.url; }));
    }
  });
  Object.keys(inspPhotos).forEach(key=>{
    if(inspPhotos[key] && inspPhotos[key].startsWith("data:")){
      jobs.push(apiPost({tool:TOOL_NAME, action:"uploadPhoto", filename:key.replace(":","_")+".jpg", base64:inspPhotos[key], site:siteName})
        .then(r=>{ if(r.ok) inspPhotos[key] = r.url; }));
    }
  });
  await Promise.all(jobs);
}

async function saveInspection(){
  if(!backendReady()){
    setSaveStatus("⚠️ ยังไม่ได้ตั้งค่า API_URL — ดูขั้นตอน Deploy Apps Script", true);
    return;
  }
  setSaveStatus("กำลังอัปโหลดรูป...");
  try{
    await uploadPendingPhotos();
    setSaveStatus("กำลังบันทึกข้อมูล...");
    const score = document.getElementById("gaugeScore").textContent;
    const payload = {
      tool: TOOL_NAME,
      action: "save",
      data: {
        cover: formData.cover, sysinfo: formData.sysinfo, fusion: formData.fusion,
        assess: formData.assess, reco: formData.reco, ack: formData.ack,
        measurements, measResults, photos, inspPhotos, photoNotes, extraEquipment,
        insp: state.scores, inspResults, inspRemarks, score,
      }
    };
    const result = await apiPost(payload);
    if(result.ok){
      setSaveStatus("✓ บันทึกแล้ว (ID: " + result.id + ")");
      if(!formData.cover.inspectionId){
        formData.cover.inspectionId = result.id;
        syncCrossLinks();
      }
      loadHistory();
    } else {
      setSaveStatus("บันทึกไม่สำเร็จ: " + result.error, true);
    }
  } catch(err){
    setSaveStatus("เกิดข้อผิดพลาด: " + err.message, true);
  }
}

async function loadInspection(id){
  setSaveStatus("กำลังโหลดข้อมูล...");
  try{
    const r = await apiGet({tool:TOOL_NAME, action:"get", id});
    if(!r.ok){ setSaveStatus("โหลดไม่สำเร็จ: " + r.error, true); return; }
    const d = r.record;
    Object.assign(formData.cover, d.cover||{});
    Object.assign(formData.assess, d.assess||{});
    Object.assign(formData.reco, d.reco||{});
    Object.assign(formData.ack, d.ack||{});
    if(d.measurements) measurements = d.measurements;
    if(d.measResults) measResults = d.measResults;
    if(d.extraEquipment) extraEquipment = d.extraEquipment;
    if(d.insp) state.scores = d.insp;
    inspResults = d.inspResults || {};
    inspRemarks = d.inspRemarks || {};
    if(d.photos) Object.assign(photos, d.photos);
    if(d.inspPhotos) Object.assign(inspPhotos, d.inspPhotos);
    if(d.photoNotes) Object.assign(photoNotes, d.photoNotes);
    // rebuild ทุกหมวดใหม่ด้วยข้อมูลที่โหลดมา (measurements, ฯลฯ) แล้วเติมค่ากลับเข้าช่อง input
    sections.forEach(s=>{ document.getElementById("sec-"+s.id).innerHTML = sectionHTML(s); });
    document.querySelectorAll("[data-bind]").forEach(el=>{
      const [g,k] = el.dataset.bind.split(".");
      if(formData[g] && formData[g][k] !== undefined) el.value = formData[g][k];
    });
    // แสดงรูปที่เคยอัปโหลดไว้กลับเข้าปุ่มถ่ายรูปแต่ละจุด
    Object.keys(photos).forEach(key=>{
      const thumb = document.getElementById("thumb-"+key);
      if(thumb && photos[key]){ thumb.style.backgroundImage = `url(${photos[key]})`; thumb.textContent=""; thumb.classList.add("has-photo"); }
    });
    Object.keys(inspPhotos).forEach(key=>{
      const thumb = document.getElementById("thumb-"+key);
      if(thumb && inspPhotos[key]){ thumb.style.backgroundImage = `url(${inspPhotos[key]})`; thumb.textContent=""; thumb.classList.add("has-photo"); }
    });
    syncCrossLinks();
    recomputeAllChecklists();
    setSaveStatus("✓ โหลดข้อมูล ID " + id + " แล้ว");
    showSection("cover");
  } catch(err){
    setSaveStatus("เกิดข้อผิดพลาด: " + err.message, true);
  }
}
</script>
</body>
</html>
